<!DOCTYPE html>

        /* --- Design System & Resets --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --charcoal: #2A2A2A;
            --white: #FFFFFF;
            --receipt-bg: #FAFAFA;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #E6E4FA 0%, var(--white) 80%);
            color: var(--charcoal);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* --- Typography Hierarchy --- */
        h1, h2, h3, .monospace, .ascii-art, .receipt-content, footer {
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        .year-link {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-transform: lowercase;
        }

        /* --- Fluid Vector-Scale ASCII Layout --- */
        .wings-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 96vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .ascii-art {
            font-size: 1.35vw;
            line-height: 1.1;
            letter-spacing: 0.05em;
            white-space: pre;
            color: var(--charcoal);
            opacity: 0.85;
            user-select: none;
        }
