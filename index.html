<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive / textual matrix.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='5' fill='%23E11A22'/></svg>">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://use.typekit.net/mrb3sjs.css">
    <style>
        :root {
            --bg-color: #161311; /* ink black, barely warm */
            --text-color: #EDEDED;

            --mondrian-red: #E11A22;
            --mondrian-blue: #004FFE;
            --mondrian-yellow: #F9CC00;
            --mondrian-white: #F2EFE9; /* paper, not monitor */

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background: var(--mondrian-yellow);
            color: #121212;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "helvetica-neue-lt-pro", Helvetica, Arial, "Pretendard", sans-serif;
            line-height: 1.6;
            text-transform: lowercase; /* every latin glyph on the page is lowercase */
            min-height: 100vh;
            padding: 12px;
            overflow-y: scroll;
        }

        /* Grain: faint riso-paper noise over everything, never intercepts input */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.06;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 8px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        h1 {
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: lowercase;
            line-height: 1.4;
        }

        /* One word of the title is misset per load — italic serif, deliberately */
        .misset {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-weight: 400;
        }

        /* Site Navigation — lowercase, small */
        .site-nav {
            display: flex;
            gap: 18px;
            font-weight: 400;
            font-size: 1rem;
            text-transform: lowercase;
        }

        .site-nav a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.85;
        }

        .nav-toggle {
            display: none;
            font-family: inherit;
            font-weight: 400;
            font-size: 1rem;
            text-transform: lowercase;
            background: none;
            border: none;
            color: var(--text-color);
            opacity: 0.85;
            cursor: pointer;
            padding: 0;
        }

        .site-nav a:hover, .nav-toggle:hover { text-decoration: underline; }

        /* Mobile: toggle in the header row; menu list spills open from the left */
        @media (max-width: 767px) {
            .nav-toggle {
                display: block;
                font-size: 0.85rem; /* match the credit */
            }

            .site-nav { font-size: 0.85rem; }

            .site-nav {
                flex-basis: 100%;
                flex-direction: column;
                gap: 10px;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.45s var(--ease);
            }

            header.nav-open .site-nav {
                max-height: 160px;
                padding-top: 14px;
            }

            .site-nav a {
                transform: translateX(-16px);
                opacity: 0;
                transition: transform 0.4s var(--ease), opacity 0.3s ease;
            }

            header.nav-open .site-nav a {
                transform: translateX(0);
                opacity: 0.85;
            }
        }

        /* Page Credit — the colophon speaks in serif */
        .credit {
            margin-top: 40px;
            padding-bottom: 8px;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-weight: 400;
            font-size: 0.85rem;
            text-transform: lowercase;
            opacity: 0.6;
        }

        /* Vertical Stack of Isolated Row Containers */
        .matrix-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 auto;
            cursor: crosshair; /* browsing as surveying */
        }

        /* Each pair lives in its own row: blocks can never drift between rows,
           even mid-transition when a pair is hidden or resizing */
        .matrix-row {
            display: flex;
            gap: 8px;
            overflow: hidden;
        }

        /* Structural Core Block Architecture */
        .block {
            position: relative; /* anchors the sold dot */
            min-height: 120px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: flex-basis 0.6s var(--ease), max-width 0.6s var(--ease),
                        transform 0.25s var(--ease);
            /* Composed so the broken block and hover nudges coexist */
            transform: translate(var(--nudge-x, 0px), var(--broken-y, 0px));
        }

        /* One block per load is deliberately, barely wrong */
        .broken { --broken-y: 5px; }

        /* The negative space physically resists you */
        @media (hover: hover) {
            .block:hover + .block { --nudge-x: 4px; }
            .block:has(+ .block:hover) { --nudge-x: -4px; }

            /* Riso misregistration: the plates slip while you hover */
            .block:hover .label {
                text-shadow: 1px 0 var(--mondrian-red), -1px 0 var(--mondrian-blue);
            }
        }

        /* Year Block Typography Profile */
        .label {
            font-weight: 900;
            font-size: clamp(1.15rem, 2.4vw, 1.9rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
            text-transform: lowercase;
            margin-top: auto;
            overflow-wrap: break-word;
            pointer-events: none;
        }

        /* Whispered totals on closed blocks — data as decoration */
        .label-count {
            font-size: 0.45em;
            font-weight: 400;
            letter-spacing: 0;
            margin-left: 6px;
            opacity: 0.55;
            vertical-align: 0.4em;
        }

        /* Quote spill: body-text size and color, left-aligned, case kept as written */
        .media-quote {
            font-size: 0.85rem;
            text-align: left;
            text-transform: none;
            padding: 4px 16px 0 0;
        }

        .quote-attr { font-style: italic; }

        /* Old-website link on the red box: Times, upright, underlined */
        .media-label {
            font-family: "Times New Roman", Times, serif;
            font-size: clamp(1.15rem, 1.8vw, 1.4rem); /* bigger than body, smaller than year labels */
            line-height: 1.1;
            text-decoration: underline;
            margin-top: auto;
            pointer-events: none;
        }

        .block.expand-media .media-label {
            margin-top: 0;
            margin-bottom: 6px;
        }

        /* Masking tape: one block per load is taped to the grid */
        .taped::before, .taped::after {
            content: "";
            position: absolute;
            width: 74px;
            height: 22px;
            background: rgba(222, 214, 186, 0.55);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        }

        .taped::before { top: -7px; left: -20px; transform: rotate(-40deg); }
        .taped::after { bottom: -7px; right: -20px; transform: rotate(-43deg); }

        /* Gallery sticker: one random year is sold. No explanation. */
        .sold-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--mondrian-red);
            pointer-events: none;
        }

        /* Color Layout Assignments */
        .b-2026, .b-2024, .b-2022 { background-color: var(--mondrian-white); color: #121212; }
        .b-2025 { background-color: var(--mondrian-blue); color: #fff; }
        .b-2023 { background-color: var(--mondrian-yellow); color: #121212; }
        .b-media { background-color: var(--mondrian-white); color: #121212; }
        .b-media.m-red { background-color: var(--mondrian-red); color: var(--text-color); }

        /* After hours (2-6am local): the palette inverts. Never announced. */
        body.after-hours {
            --bg-color: #EDEDE9;
            --text-color: #141414;
            --mondrian-white: #1B1B1B;
        }

        body.after-hours .b-2026,
        body.after-hours .b-2024,
        body.after-hours .b-2022,
        body.after-hours .b-media { color: #EDEDED; }

        body.after-hours .b-media.m-red { color: #fff; }

        body.after-hours .book-item {
            border-bottom-color: rgba(255, 255, 255, 0.15);
        }

        body.after-hours .b-2026.expand-list .label,
        body.after-hours .b-2024.expand-list .label,
        body.after-hours .b-2022.expand-list .label {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="4" preserveAspectRatio="none"><path d="M0 2.2 Q 20 1.1 40 2.0 T 80 1.7 T 120 2.5 T 160 1.9" fill="none" stroke="%23ffffff" stroke-width="1.7"/></svg>');
        }

        /* Hidden Spill Mechanics — no transition here, so closing collapses
           instantly instead of bouncing the row while the block narrows */
        .spill-content {
            max-height: 0;
            opacity: 0;
            visibility: hidden;
        }

        /* Book Lists layout (Vertical Expand Only) */
        .book-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .book-item {
            font-size: 0.85rem;
            line-height: 1.4;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            letter-spacing: 0.02em; /* Tracking added for content internal links/strings */
        }

        .b-2025 .book-item {
            border-bottom: 1px solid rgba(255,255,255,0.18);
        }

        .book-title { font-weight: 700; overflow-wrap: break-word; }
        .book-author { font-weight: 400; opacity: 0.75; margin-left: 6px; letter-spacing: 0.05em; overflow-wrap: break-word; }

        /* Media Frame layout (Horizontal Fluidity Setup) */
        .media-track-wrapper {
            overflow-x: auto;
            padding-top: 4px;
            display: flex;
        }

        .media-embed {
            flex: 1 1 auto;
            width: 100%; /* fill the block — a fixed width clipped the player's right side */
            height: 175px; /* Apple Music compact player's native height — anything less clips it */
            border-radius: 2px;
            border: none;
        }

        /* --- Global Structural Rules Applied via JS Toggles --- */

        /* Rule: Year lists spill vertically, forcing row domination if narrower than 1/2 */
        .block.expand-list {
            flex-basis: 100% !important;
            max-width: 100% !important;
            /* Cap at two rows' height (2 x 120px + 8px gap); the list scrolls inside */
            max-height: 248px;
        }

        /* Rule: Media blocks spill outwards horizontally along the row,
           matching the expanded list blocks' two-row height */
        .block.expand-media {
            flex-basis: calc(80% - 4px) !important;
            max-width: calc(80% - 4px) !important;
            min-height: 248px;
            max-height: 248px;
            justify-content: center; /* embed sits centered in the matched height */
        }

        /* Rule: Media block takes the full row when its pair is hidden */
        .block.expand-media.expand-full {
            flex-basis: 100% !important;
            max-width: 100% !important;
        }

        .block.expand-list .label {
            flex-shrink: 0; /* the label never gives up space to the scrolling list */
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 6px;
            width: max-content;
            max-width: 100%;
            /* Hand-ruled underline: drawn with a pencil, not a machine */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="4" preserveAspectRatio="none"><path d="M0 2.2 Q 20 1.1 40 2.0 T 80 1.7 T 120 2.5 T 160 1.9" fill="none" stroke="%23121212" stroke-width="1.7"/></svg>');
            background-repeat: repeat-x;
            background-position: 0 100%;
            background-size: 160px 4px;
        }

        /* The blue block rules its line in white */
        .b-2025.expand-list .label {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="4" preserveAspectRatio="none"><path d="M0 2.2 Q 20 1.1 40 2.0 T 80 1.7 T 120 2.5 T 160 1.9" fill="none" stroke="%23ffffff" stroke-width="1.7"/></svg>');
        }

        /* Mobile Typography Scale: short ’YY labels get significantly more presence */
        @media (max-width: 767px) {
            .label {
                font-size: 1.9rem;
            }
        }

        /* Web Spacing: give the label's dividing line more room around it */
        @media (min-width: 768px) {
            .block.expand-list .label {
                padding-bottom: 8px;
                margin-bottom: 16px;
            }
        }

        .block.expand-list .spill-content, .block.expand-media .spill-content {
            max-height: 250px;
            opacity: 1;
            visibility: visible;
            overflow-y: auto;
            scrollbar-width: thin;
            /* Slight delay lets the block reach most of its width before the
               content spills, so list rows don't wrap-and-unwrap mid-animation */
            transition: max-height 0.45s var(--ease) 0.15s, opacity 0.3s ease 0.15s;
        }

        /* Remove associated pair block entirely so it can't occupy a phantom row */
        .hide-pair {
            display: none !important;
        }

        /* Desktop Constraint: entire matrix stays within 70% of the viewport width */
        @media (min-width: 768px) {
            .matrix-container {
                max-width: 60vw;
            }
        }

        /* The anti-website: print (Cmd/Ctrl+P) renders the whole archive as a
           plain typewritten list — black on white, everything expanded */
        @media print {
            body {
                background: #fff;
                color: #000;
                padding: 0;
                overflow: visible;
                font-family: "Courier New", Courier, monospace;
            }

            body::after, .site-nav, .nav-toggle, .b-media, .sold-dot, .label-count {
                display: none !important;
            }

            .taped::before, .taped::after { display: none; }

            header { border-color: #000; display: block; }

            h1 { font-family: inherit; font-size: 14pt; letter-spacing: 0; }
            h1 .misset { font-family: inherit; font-style: normal; }

            .matrix-container, .matrix-row {
                display: block;
                max-width: none;
                overflow: visible;
            }

            .block {
                display: block;
                min-height: 0;
                max-height: none !important;
                max-width: 100% !important;
                padding: 12pt 0;
                background: none !important;
                color: #000 !important;
                overflow: visible;
                transition: none;
                transform: none;
            }

            .label { font-size: 12pt; letter-spacing: 0; margin: 0 0 6pt; }

            .spill-content {
                max-height: none !important;
                opacity: 1 !important;
                visibility: visible !important;
                overflow: visible !important;
            }

            .book-item { border: none; font-size: 9pt; letter-spacing: 0; padding: 0; }
            .book-author { opacity: 1; }

            .credit { font-family: inherit; opacity: 1; }
        }
    </style>
</head>

        const buildEmbed = src => `<iframe class="media-embed" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="${src}"></iframe>`;

        const isMobile = window.innerWidth < 768;

        // Titles/authors are injected via innerHTML; escape markup characters

        const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // Mathematical Grid Fractional Slices
        const mobileFractions = [1/2, 1/3, 2/3];
        const webFractions = [1/2, 1/3, 2/3, 1/4, 3/4, 2/5, 3/5];

        function generateMatrix() {
            container.innerHTML = "";
            const fractions = isMobile ? mobileFractions : webFractions;

            archiveData.forEach((item, index) => {
                // Generate primary random fraction slice
                const randomFraction = fractions[Math.floor(Math.random() * fractions.length)];

                // Deduce perfect complementary mathematical negative space profile
                const primaryPercent = (randomFraction * 100);
                const complementPercent = (100 - primaryPercent);

                // Gap calculation correction rules
                const stylePrimary = `flex: 0 0 calc(${primaryPercent}% - 4px); max-width: calc(${primaryPercent}% - 4px);`;
                const styleComplement = `flex: 0 0 calc(${complementPercent}% - 4px); max-width: calc(${complementPercent}% - 4px);`;

                // Build Primary Year Block Structure
                const yearId = `block-year-${index}`;
                const mediaId = `block-media-${index}`;

                const yearBlock = document.createElement('div');
                yearBlock.className = `block ${item.class}`;
                yearBlock.id = yearId;
                yearBlock.style.cssText = stylePrimary;
                yearBlock.dataset.baseStyle = stylePrimary;
                yearBlock.setAttribute('onclick', `toggleList('${yearId}', '${mediaId}')`);

                let listHtml = `<div class="label" data-full="${item.year}" data-short="${item.short}" data-count="${item.data.length}">${item.year}</div><div class="spill-content"><ul class="book-list">`;
                item.data.forEach(book => {
                    const authorHtml = book[1] ? `<span class="book-author">${escapeHtml(book[1])}</span>` : '';
                    listHtml += `<li class="book-item"><span class="book-title">${escapeHtml(book[0])}</span>${authorHtml}</li>`;
                });
                listHtml += `</ul></div>`;
                yearBlock.innerHTML = listHtml;

                // Build Complementary Unlabeled White Box Negative Space Block
                const mediaBlock = document.createElement('div');
                mediaBlock.className = `block b-media${item.mediaClass ? ' ' + item.mediaClass : ''}`;
                mediaBlock.id = mediaId;
                mediaBlock.style.cssText = styleComplement;
                mediaBlock.dataset.baseStyle = styleComplement;
                mediaBlock.setAttribute('onclick', `toggleMedia('${mediaId}', '${yearId}', ${primaryPercent})`);

                // Spill space carries a quote when the data provides one,
                // otherwise a single running media frame
                const mediaLabel = item.mediaTitle ? `<div class="media-label">${item.mediaTitle}</div>` : '';
                let spillInner;
                if (item.mediaQuote) {
                    const q = item.mediaQuote;
                    spillInner = `<blockquote class="media-quote"><strong>${q.speaker}</strong> ${q.text}<br><em class="quote-attr">${q.attribution}</em></blockquote>`;
                } else {
                    spillInner = `<div class="media-track-wrapper">${buildEmbed(item.mediaSrc || mediaSrcs[index % mediaSrcs.length])}</div>`;
                }
                mediaBlock.innerHTML = `${mediaLabel}<div class="spill-content">${spillInner}</div>`;

                // Render each pair inside its own isolated row container
                const rowEl = document.createElement('div');
                rowEl.className = 'matrix-row';
                rowEl.appendChild(yearBlock);
                rowEl.appendChild(mediaBlock);
                container.appendChild(rowEl);
            });

            // One random year is sold. No explanation.
            const soldIndex = Math.floor(Math.random() * archiveData.length);
            const soldDot = document.createElement('span');
            soldDot.className = 'sold-dot';
            document.getElementById(`block-year-${soldIndex}`).appendChild(soldDot);

            // Two blocks per load are deliberately, consistently wrong, and two
            // are taped to the grid — picked independently, so a block can be
            // broken, taped, or both
            const blocks = container.querySelectorAll('.block');
            const pickTwo = n => {
                const a = Math.floor(Math.random() * n);
                let b = Math.floor(Math.random() * (n - 1));
                if (b >= a) b++;
                return [a, b];
            };
            pickTwo(blocks.length).forEach(i => blocks[i].classList.add('broken'));
            pickTwo(blocks.length).forEach(i => blocks[i].classList.add('taped'));

            fitLabels();
        }

        // Label fitting: if a block is so narrow that the label's longest word
        // would have to break mid-word, switch to the short ’YY form instead
        const measureCtx = document.createElement('canvas').getContext('2d');

        function fitLabels() {
            const mobileView = window.innerWidth < 768;

            document.querySelectorAll('.label').forEach(label => {
                const full = label.dataset.full;
                if (!full) return;

                const block = label.closest('.block');
                let next;

                if (block.classList.contains('expand-list')) {
                    // An opened block always carries its full name
                    next = full;
                } else if (mobileView) {
                    // On mobile, closed blocks default to the short ’YY form
                    next = label.dataset.short;
                } else {
                    const avail = block.clientWidth - 24; // block padding: 12px per side
                    if (avail <= 0) return; // hidden pair, leave as is

                    const cs = getComputedStyle(label);
                    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                    const tracking = parseFloat(cs.letterSpacing) || 0;

                    const longestWord = full.split(/\s+/).reduce((max, word) => {
                        const w = measureCtx.measureText(word).width + tracking * word.length;
                        return Math.max(max, w);
                    }, 0);

                    next = longestWord > avail ? label.dataset.short : full;
                }

                // Every block whispers its total, open or closed
                const html = `${next} <span class="label-count">(${label.dataset.count})</span>`;
                if (label.dataset.rendered !== html) {
                    label.innerHTML = html;
                    label.dataset.rendered = html;
                }
            });
        }

        // Re-fit whenever a block finishes resizing, and on viewport changes
        container.addEventListener('transitionend', e => {
            if (e.propertyName === 'flex-basis' || e.propertyName === 'max-width') fitLabels();
        });
        window.addEventListener('resize', fitLabels);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);

        // Restore a single pair to its generated baseline; other rows are never touched,
        // so previously opened blocks keep their state until the user acts on them directly
        function resetPair(yearEl, mediaEl) {
            [yearEl, mediaEl].forEach(b => {
                b.classList.remove('expand-list', 'expand-media', 'expand-full', 'hide-pair');
                b.style.cssText = b.dataset.baseStyle || "";
            });
        }

        // Action Rules: Lists spill vertically, never narrower than 50% (snap full width if needed)
        function toggleList(yearId, mediaId) {
            const yearEl = document.getElementById(yearId);
            const mediaEl = document.getElementById(mediaId);
            const active = yearEl.classList.contains('expand-list');

            resetPair(yearEl, mediaEl);

            if (!active) {
                yearEl.classList.add('expand-list');
                mediaEl.classList.add('hide-pair');
                // Opening: keep the current (short) label until the block reaches
                // full width — transitionend runs fitLabels. Swapping to the full
                // name while still narrow forces mid-word breaks and a height bounce.
            } else {
                fitLabels();
            }
        }

        // Action Rules: Media blocks spill horizontally along their paired space line
        function toggleMedia(mediaId, yearId, primaryWidth) {
            const mediaEl = document.getElementById(mediaId);
            const yearEl = document.getElementById(yearId);
            const active = mediaEl.classList.contains('expand-media');

            resetPair(yearEl, mediaEl);

            if (!active) {
                mediaEl.classList.add('expand-media');

                // If native remaining space drops behind 50%, safety lock structural layout bounds
                if (primaryWidth < 50) {
                    yearEl.classList.add('hide-pair');
                    mediaEl.classList.add('expand-full');
                } else {
                    yearEl.style.flexBasis = "calc(20% - 4px)";
                    yearEl.style.maxWidth = "calc(20% - 4px)";
                }
            }

            fitLabels();
        }

        function toggleNav() {
            const header = document.getElementById('siteHeader');
            const open = header.classList.toggle('nav-open');
            document.getElementById('navToggle').textContent = open ? 'close.' : 'more.';
        }

        // One word of the title is misset per load — italic serif, deliberately
        function missetTitle() {
            const h1 = document.querySelector('h1');
            const words = h1.textContent.split(' ');
            const candidates = words.map((w, i) => w !== '/' ? i : -1).filter(i => i >= 0);
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            h1.innerHTML = words.map((w, i) => i === pick ? `<span class="misset">${w}</span>` : w).join(' ');
        }

        // On a few loads, the credit quietly lies
        function equivocateCredit() {
            if (Math.random() < 0.05) {
                const credit = document.querySelector('.credit');
                credit.textContent = credit.textContent.replace('all rights', 'some rights');
            }
        }

        const hour = new Date().getHours();
        if (hour >= 2 && hour < 6) document.body.classList.add('after-hours');

        const siteTitle = document.title;

            document.title = document.hidden ? 'waiting here…' : siteTitle;
