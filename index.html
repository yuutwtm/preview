<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — Balanced Matrix</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #141414; 
            --text-color: #EDEDED;
            
            --mondrian-red: #E11A22;
            --mondrian-blue: #004FFE;
            --mondrian-yellow: #F9CC00;
            --mondrian-white: #F5F5F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, 'Pretendard', sans-serif;
            min-height: 100vh;
            padding: 16px 0;
            overflow-y: scroll;
        }

        /* Responsive Wrapper Constraints: 70% of screen width on desktop screens */
        .page-wrapper {
            width: 100%;
            padding: 0 16px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .page-wrapper {
                width: 70vw; 
                padding: 0;
            }
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 8px;
        }

        h1 {
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: lowercase;
        }

        /* Matrix Container layout rules with uniform padding rhythm */
        .matrix-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }

            position: relative;
            min-height: 130px;
