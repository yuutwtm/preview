<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Space</title>
    <style>
        /* --- Design System (MoMA Vibe) --- */
        :root {
            --bg-color: #f7f7f5;       /* Soft, warm off-white */
            --text-color: #1a1a1a;     /* Deep off-black */
            --accent-vivid-1: #ff3b30; /* Vivid Crimson */
            --accent-vivid-2: #007aff; /* Vivid Electric Blue */
            --accent-vivid-3: #34c759; /* Vivid Acid Green */
            --blur-amount: 2.5px;      
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Landing Screen --- */
        #landing-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s ease, transform 0.6s ease;
            padding: 20px;
            opacity: 1; /* Explicitly visible on load */
        }

        .landing-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .landing-prompt {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            font-weight: 500;
            opacity: 0.8;
        }

        .landing-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-color);
            padding: 12px 4px;
            font-size: 1.5rem;
            font-family: inherit;
            color: var(--text-color);
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
            border-radius: 0;
        }

        .landing-input:focus {
            border-color: var(--accent-vivid-1);
        }

        .landing-hint {
            margin-top: 12px;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
