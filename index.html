<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — Balanced Matrix</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #141414; 
            --text-color: #EDEDED;
            
            --mondrian-red: #E11A22;
            --mondrian-blue: #004FFE;
            --mondrian-yellow: #F9CC00;
            --mondrian-white: #F5F5F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, 'Pretendard', sans-serif;
            min-height: 100vh;
            padding: 16px 0;
            overflow-y: scroll;
        }

        .page-wrapper {
            width: 100%;
            padding: 0 16px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .page-wrapper {
                width: 70vw; 
                padding: 0;
            }
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 8px;
        }

        h1 {
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: lowercase;
        }

        .matrix-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }

        .block {
            position: relative;
            min-height: 130px;
            padding: 14px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: flex-basis 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        width 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        max-width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .label {
            font-family: 'Helvetica Neue', Helvetica, sans-serif;
            font-weight: 900;
            font-size: clamp(1.1rem, 2vw, 1.8rem);
            line-height: 0.85;
            letter-spacing: -0.07em;
            text-transform: lowercase;
            margin-top: auto; 
            white-space: nowrap;
            pointer-events: none;
        }

        .b-2026 { background-color: var(--mondrian-red); color: #fff; }
        .b-2025 { background-color: var(--mondrian-blue); color: #fff; }
        .b-2024 { background-color: var(--mondrian-white); color: #121212; }
        .b-2023 { background-color: var(--mondrian-yellow); color: #121212; }
        .b-2022 { background-color: var(--mondrian-white); color: #121212; }
        .b-media { background-color: var(--mondrian-white); cursor: pointer; }

        .spill-content {
            max-height: 0;
            opacity: 0;
            visibility: hidden;
            transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            width: 100%;
        }

        .book-list {
            list-style: none;
            padding-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 140px; 
            overflow-y: auto;
            padding-right: 4px;
        }

        .book-item {
            font-size: 0.95rem;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            letter-spacing: 0.04em;
            white-space: normal;
            word-break: keep-all; 
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        .b-2026 .book-item, .b-2025 .book-item {
            border-bottom: 1px solid rgba(255,255,255,0.18);
        }

        .book-title { font-family: 'Pretendard', sans-serif; font-weight: 700; }
        .book-author { font-family: 'Pretendard', sans-serif; font-weight: 400; opacity: 0.75; margin-left: 6px; }

        .media-track-wrapper {
            width: 100%;
            padding-top: 4px;
            display: flex;
            justify-content: flex-start;
        }

        .media-embed {
            width: 100%;
            height: 80px; 
            border-radius: 2px;
            border: none;
            overflow: hidden;
        }

        .block.expand-list {
            flex-basis: 100% !important;
            max-width: 100% !important;
            cursor: default;
        }

        .block.expand-media {
            flex-basis: 100% !important;
            max-width: 100% !important;
        }

        @media (min-width: 768px) {
            .block.expand-media {
                flex-basis: 80% !important;
                max-width: 80% !important;
            }
        }

        .block.expand-list .label {
            margin-top: 0;
            margin-bottom: 6px;
            border-bottom: 2px solid currentColor;
            padding-bottom: 2px;
            width: max-content;
        }

        .block.expand-list .spill-content, .block.expand-media .spill-content {
            max-height: 400px;
            opacity: 1;
            visibility: visible;
        }

        .hide-pair {
            flex-basis: 0% !important;
            max-width: 0% !important;
            padding: 0 !important;
            opacity: 0;
            border: none;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <header>
            <h1>archive / structured matrix</h1>
        </header>

        <main class="matrix-container" id="matrixContainer"></main>
    </div>

    <script>
        const archiveData = [
            { year: "twenty twenty-six", class: "b-2026", data: [["디자인의 디자인", "Hara Kenya"], ["The Design of Everyday Things", "Don Norman"], ["물고기는 존재하지 않는다", "Lulu Miller"], ["사피엔스", "Yuval Noah"]] },
            { year: "twenty twenty-five", class: "b-2025", data: [["바른 마음", "Jonathan Haidt"], ["Grid Systems", "Müller-Brockmann"]] },
            { year: "twenty twenty-four", class: "b-2024", data: [["도둑맞은 집중력", "Johann Hari"], ["No Longer Human", "Osamu Dazai"]] },
            { year: "twenty twenty-three", class: "b-2023", data: [["Norwegian Wood", "Haruki Murakami"]] },
            { year: "twenty twenty-two", class: "b-2022", data: [["공정하다는 착각", "Michael Sandel"]] }
        ];

        const mediaEmbeds = [
            `<iframe class="media-embed" src="https://embed.music.apple.com/us/album/supernatural/1747043133?i=1747043134"></iframe>`,
            `<iframe class="media-embed" src="https://embed.music.apple.com/us/album/hype-boy/1635217435?i=1635217436"></iframe>`
        ];

        const container = document.getElementById('matrixContainer');

        const mobileFractions = [1/2, 1/3, 2/3];
        const webFractions = [1/2, 1/3, 2/3, 1/4, 3/4, 2/5, 3/5];

        function generateMatrix() {
            container.innerHTML = "";
            const isMobile = window.innerWidth < 768;
            const fractions = isMobile ? mobileFractions : webFractions;

            archiveData.forEach((item, index) => {
                const randomFraction = fractions[Math.floor(Math.random() * fractions.length)];
                
                const primaryPercent = (randomFraction * 100);
                const complementPercent = (100 - primaryPercent);

                const stylePrimary = `flex: 0 0 calc(${primaryPercent}% - 6px); max-width: calc(${primaryPercent}% - 6px);`;
                const styleComplement = `flex: 0 0 calc(${complementPercent}% - 6px); max-width: calc(${complementPercent}% - 6px);`;

                const yearId = `block-year-${index}`;
                const mediaId = `block-media-${index}`;

                // Year lists
                const yearBlock = document.createElement('div');
                yearBlock.className = `block ${item.class}`;
                yearBlock.id = yearId;
                yearBlock.style.cssText = stylePrimary;
                yearBlock.setAttribute('onclick', `toggleList('${yearId}', '${mediaId}')`);
                
                let listHtml = `<div class="label">${item.year}</div><div class="spill-content"><ul class="book-list">`;
                item.data.forEach(book => {
                    listHtml += `<li class="book-item"><span class="book-title">${book[0]}</span><span class="book-author">${book[1]}</span></li>`;
                });
                listHtml += `</ul></div>`;
                yearBlock.innerHTML = listHtml;

                // Media boxes
                const mediaBlock = document.createElement('div');
                mediaBlock.className = `block b-media`;
                mediaBlock.id = mediaId;
                mediaBlock.style.cssText = styleComplement;
                mediaBlock.setAttribute('onclick', `toggleMedia('${mediaId}', '${yearId}', ${primaryPercent})`);
                
                const randomMedia = mediaEmbeds[index % mediaEmbeds.length];
                mediaBlock.innerHTML = `<div class="spill-content"><div class="media-track-wrapper">${randomMedia}</div></div>`;

                container.appendChild(yearBlock);
                container.appendChild(mediaBlock);
            });
        }

        function toggleList(yearId, mediaId) {
            const yearEl = document.getElementById(yearId);
            const mediaEl = document.getElementById(mediaId);
            const active = yearEl.classList.contains('expand-list');

            resetAll();

            if (!active) {
                yearEl.classList.add('expand-list');
                mediaEl.classList.add('hide-pair');
                
                if (window.innerWidth < 768) {
                    const breaker = document.createElement('div');
                    breaker.className = 'row-breaker';
                    breaker.style.cssText = 'flex-basis: 100%; height: 0; margin: 0; padding: 0;';
                    mediaEl.parentNode.insertBefore(breaker, mediaEl.nextSibling);
                }
            }
        }

        function toggleMedia(mediaId, yearId, primaryWidth) {
            const mediaEl = document.getElementById(mediaId);
            const yearEl = document.getElementById(yearId);
            const active = mediaEl.classList.contains('expand-media');
            const isMobile = window.innerWidth < 768;

            resetAll();

            if (!active) {
                mediaEl.classList.add('expand-media');
                
                if (isMobile) {
                    yearEl.classList.add('hide-pair');
                    
                    const breaker = document.createElement('div');
                    breaker.className = 'row-breaker';
                    breaker.style.cssText = 'flex-basis: 100%; height: 0; margin: 0; padding: 0;';
                    mediaEl.parentNode.insertBefore(breaker, mediaEl.nextSibling);
                } else if (primaryWidth < 50) {
                    yearEl.classList.add('hide-pair');
                } else {
                    yearEl.style.flexBasis = "20%";
                    yearEl.style.maxWidth = "20%";
                }
            }
        }

        function resetAll() {
            document.querySelectorAll('.row-breaker').forEach(el => el.remove());
            
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('expand-list', 'expand-media', 'hide-pair');
                b.style.flexBasis = "";
                b.style.maxWidth = "";
            });
        }

        // Executing instantly instead of blocking on window.onload
        generateMatrix();
        window.addEventListener('resize', generateMatrix);
    </script>
</body>
</html>
