<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Site</title>
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/mrb3sjs.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <style>
        :root {
            --font-display: "helvetica-neue-lt-pro", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: "helvetica-neue-lt-pro", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;

            /* Single Point Color */
            --accent-color: #FF8000;

            /* Light Mode Background Gradient (Very subtle grey top -> light bottom) */
            --bg-top: #f1f1f2;
            --bg-bottom: #fafafa;
            --text-color: #222222;
            --text-muted: #888888;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Mode Background Gradient */
                --bg-top: #101011;
                --bg-bottom: #161617;
                --text-color: #e4e4e5;
                --text-muted: #8e8e93;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100dvh;
            overflow-y: auto;
        }

        body {
            /* Linear Gradient Background */
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-body);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.3s;
            padding: 2rem 1rem;
        }

        /* Center Layout Container with Load Animation */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
            margin: auto;
            
            /* Stack from bottom effect on load */
            animation: stackFromBottom 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes stackFromBottom {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Uncopiable, Non-breaking ASCII Art */
        .ascii-art {
            font-family: monospace;
            font-size: 8px;
            line-height: 1;
            letter-spacing: 0;
            white-space: pre;
            color: var(--text-color);
            opacity: 0.85;
            text-align: center;
            margin-bottom: 0.5rem;
            
            /* Non-copiable & non-selectable */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            pointer-events: none;

            /* Responsive scaling to prevent line breaks on smaller devices */
            max-width: 100%;
            overflow-x: hidden;
        }

        @media (max-width: 420px) {
            .ascii-art {
                font-size: 6px;
            }
        }

        .section-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Monotone, Larger, Tightened Lowercase Links */
        .trigger-btn {
            font-family: var(--font-display);
            font-size: 1.15rem;
            letter-spacing: -0.03em;
            text-transform: lowercase;
            color: var(--text-color);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            transition: opacity 0.2s ease, color 0.2s ease;
            outline: none;
        }

        .trigger-btn:hover {
            opacity: 0.6;
        }

        .section-item.active .trigger-btn {
            color: var(--accent-color);
        }

        /* Inline Spilling Content Drawer */
        .spill-content {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin 0.3s ease;
            margin-top: 0;
        }

        .section-item.active .spill-content {
            max-height: 1200px;
            opacity: 1;
            margin-top: 0.75rem;
        }

        /* Seamless Inner Content Card */
        .card-inner {
            background-color: transparent;
            border: none;
            border-radius: 0;
            padding: 1rem 0.5rem;
            box-shadow: none;
            text-align: left;
            position: relative;
        }

        /* Top Right Close 'x' Toggle */
        .card-close-btn {
            position: absolute;
            top: 0.8rem;
            right: 0.5rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem;
            transition: color 0.2s ease;
        }

        .card-close-btn:hover {
            color: var(--accent-color);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
            color: var(--accent-color);
            padding-right: 1.5rem;
        }

        .card-body {
            font-size: 0.85rem;
            line-height: 1.65;
            color: var(--text-color);
        }

        .card-body p {
            margin-bottom: 0.5rem;
        }

        .card-body a {
            color: var(--accent-color);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Media Embed Adjustments */
        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 8px;
            margin-top: 0.8rem;
        }

        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        iframe[src*="music.apple.com"] {
            border-radius: 8px;
            margin-top: 0.8rem;
        }
    </style>
</head>
